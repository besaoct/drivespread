<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveSpread Realtime Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(20, 20, 25, 0.6);
      --card-border: rgba(63, 63, 70, 0.4);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.2);
      
      --priority-low: #10b981;
      --priority-med: #f59e0b;
      --priority-high: #ef4444;

      --font: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
      overflow-y: auto;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #ffffff, #a1a1aa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Connection Status */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #71717a;
      box-shadow: 0 0 8px #71717a;
      transition: all 0.3s ease;
    }

    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .status-dot.connecting {
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Form */
    form {
      display: flex;
      gap: 0.75rem;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    select {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      padding: 0.8rem 1rem;
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font);
      outline: none;
      cursor: pointer;
      font-size: 0.95rem;
    }

    select:focus {
      border-color: var(--accent);
    }

    button.btn-add {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 1.5rem;
      border-radius: 10px;
      font-family: var(--font);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.btn-add:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    /* Lists */
    .todo-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .todo-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: all 0.2s ease;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .todo-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateX(4px);
    }

    .todo-item.optimistic {
      opacity: 0.6;
      pointer-events: none;
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
    }

    /* Custom Checkbox */
    .checkbox-container {
      position: relative;
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .checkbox-container input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    .checkmark {
      position: absolute;
      top: 0;
      left: 0;
      height: 18px;
      width: 18px;
      background-color: transparent;
      border: 2px solid var(--text-muted);
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .checkbox-container:hover input ~ .checkmark {
      border-color: var(--accent);
    }

    .checkbox-container input:checked ~ .checkmark {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .checkmark:after {
      content: "";
      position: absolute;
      display: none;
    }

    .checkbox-container input:checked ~ .checkmark:after {
      display: block;
    }

    .checkbox-container .checkmark:after {
      left: 5px;
      top: 1px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .todo-title {
      font-size: 0.95rem;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .todo-item.completed .todo-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Priority badges */
    .priority-badge {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .priority-1 { background: rgba(16, 185, 129, 0.15); color: var(--priority-low); }
    .priority-2 { background: rgba(245, 158, 11, 0.15); color: var(--priority-med); }
    .priority-3 { background: rgba(239, 68, 68, 0.15); color: var(--priority-high); }

    /* Actions buttons */
    .todo-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-action {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.25rem;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-action.delete:hover {
      color: var(--priority-high);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 1.5rem;
      border: 1px dashed var(--card-border);
      border-radius: 10px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loader {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent-glow);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>DriveSpread Tasks</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">Google Sheets Backed Realtime DB</p>
      </div>
      <div class="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Connecting...</span>
        <div class="loader" id="status-loader"></div>
      </div>
    </header>

    <!-- Task Form -->
    <form id="todo-form" onsubmit="addTodo(event)">
      <div class="input-wrapper">
        <input type="text" id="todo-input" placeholder="What needs to be done?" required autocomplete="off">
      </div>
      <select id="todo-priority">
        <option value="1">Low</option>
        <option value="2" selected>Medium</option>
        <option value="3">High</option>
      </select>
      <button type="submit" class="btn-add">Add</button>
    </form>

    <!-- Active Tasks -->
    <div class="todo-section">
      <h2 class="section-title">Active Tasks</h2>
      <div class="todo-list" id="active-list">
        <div class="empty-state">No active tasks. Good job!</div>
      </div>
    </div>

    <!-- Completed Tasks -->
    <div class="todo-section">
      <h2 class="section-title">Completed Tasks</h2>
      <div class="todo-list" id="completed-list">
        <div class="empty-state">No completed tasks yet.</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { DriveSpreadClient } from '/client.js';

    let todos = [];
    let wsClient = null;

    window.onload = async () => {
      setupWebSocket();
      await fetchTodos();
    };

    // Set up WebSocket realtime subscriptions and client
    function setupWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const loader = document.getElementById('status-loader');

      dot.className = 'status-dot connecting';
      text.innerText = 'Connecting...';

      wsClient = new DriveSpreadClient(wsUrl);

      // Subscribe to all changes in 'todos' collection
      wsClient.subscribe('todos', {}, (event) => {
        const { type, row } = event;
        
        if (type === 'insert') {
          // Add if not exists
          if (!todos.some(t => t._id === row._id)) {
            todos.push(row);
          }
        } else if (type === 'update') {
          const idx = todos.findIndex(t => t._id === row._id);
          if (idx !== -1) {
            todos[idx] = row;
          }
        } else if (type === 'delete') {
          todos = todos.filter(t => t._id !== row._id);
        }

        renderLists();
      });

      // Update connection status indicators using persistent callbacks
      wsClient.onOpen = () => {
        dot.className = 'status-dot connected';
        text.innerText = 'Synced';
      };

      wsClient.onClose = () => {
        dot.className = 'status-dot';
        text.innerText = 'Offline';
      };

      // Loading state hook
      wsClient.onLoadingChange = (isLoading) => {
        if (isLoading) {
          loader.classList.add('active');
        } else {
          loader.classList.remove('active');
        }
      };
    }

    // Fetch Initial Data
    async function fetchTodos() {
      try {
        todos = await wsClient.find('todos');
        renderLists();
      } catch (err) {
        console.error('Error fetching todos:', err);
      }
    }

    // Render Lists to DOM
    let renderTimeout = null;
    function renderLists() {
      if (renderTimeout) clearTimeout(renderTimeout);
      renderTimeout = setTimeout(() => actualRenderLists(), 20);
    }

    function actualRenderLists() {
      const activeList = document.getElementById('active-list');
      const completedList = document.getElementById('completed-list');

      // Clear lists
      activeList.innerHTML = '';
      completedList.innerHTML = '';

      const activeTodos = todos.filter(t => !t.completed).sort((a, b) => b.priority - a.priority);
      const completedTodos = todos.filter(t => t.completed).sort((a, b) => new Date(b._updatedAt) - new Date(a._updatedAt));

      if (activeTodos.length === 0) {
        activeList.innerHTML = '<div class="empty-state">No active tasks. Good job!</div>';
      } else {
        activeTodos.forEach(todo => {
          activeList.appendChild(createTodoItemEl(todo));
        });
      }

      if (completedTodos.length === 0) {
        completedList.innerHTML = '<div class="empty-state">No completed tasks yet.</div>';
      } else {
        completedTodos.forEach(todo => {
          completedList.appendChild(createTodoItemEl(todo));
        });
      }
    }

    // Create Todo Item Element
    function createTodoItemEl(todo) {
      const el = document.createElement('div');
      el.className = `todo-item ${todo.completed ? 'completed' : ''} ${todo._isOptimistic ? 'optimistic' : ''}`;
      el.id = `todo-${todo._id}`;

      el.innerHTML = `
        <div class="todo-left">
          <label class="checkbox-container">
            <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleCompleted('${todo._id}', this.checked)">
            <span class="checkmark"></span>
          </label>
          <span class="todo-title">${escapeHtml(todo.title)}</span>
          <span class="priority-badge priority-${todo.priority}">${todo.priority === 3 ? 'High' : todo.priority === 2 ? 'Medium' : 'Low'}</span>
        </div>
        <div class="todo-actions">
          <button class="btn-action delete" onclick="deleteTodo('${todo._id}')">🗑</button>
        </div>
      `;

      return el;
    }

    // Helper functions exposed globally for onclick handlers
    window.toggleCompleted = async (id, checked) => {
      // Optimistic Update
      const todoIdx = todos.findIndex(t => t._id === id);
      if (todoIdx === -1) return;
      
      const previousState = todos[todoIdx].completed;
      todos[todoIdx].completed = checked;
      todos[todoIdx]._isOptimistic = true;
      renderLists();

      try {
        const realTodo = await wsClient.updateById('todos', id, { completed: checked });
        todos[todoIdx] = realTodo;
        renderLists();
      } catch (err) {
        console.error('Error updating todo status:', err);
        // Rollback
        todos[todoIdx].completed = previousState;
        delete todos[todoIdx]._isOptimistic;
        renderLists();
        alert('Failed to update todo');
      }
    };

    window.deleteTodo = async (id) => {
      // Optimistic Delete
      const todoIdx = todos.findIndex(t => t._id === id);
      if (todoIdx === -1) return;
      
      const todoToRestore = todos[todoIdx];
      todos.splice(todoIdx, 1);
      renderLists();

      try {
        await wsClient.deleteById('todos', id);
      } catch (err) {
        console.error('Error deleting todo:', err);
        // Rollback
        todos.push(todoToRestore);
        renderLists();
        alert('Failed to delete todo');
      }
    };

    window.addTodo = async (event) => {
      event.preventDefault();
      const input = document.getElementById('todo-input');
      const prioritySelect = document.getElementById('todo-priority');
      
      const title = input.value.trim();
      const priority = Number(prioritySelect.value);
      if (!title) return;

      input.value = '';
      
      // Optimistic Insert
      const tempId = 'temp-' + Date.now();
      const tempTodo = {
        _id: tempId,
        title,
        priority,
        completed: false,
        _createdAt: new Date().toISOString(),
        _updatedAt: new Date().toISOString(),
        _isOptimistic: true
      };
      todos.push(tempTodo);
      renderLists();
      
      try {
        const realTodo = await wsClient.insert('todos', { title, priority });
        // Handle WebSocket concurrency
        const existsIdx = todos.findIndex(t => t._id === realTodo._id);
        if (existsIdx !== -1) {
          // Already added by WebSocket! Just remove the temp one.
          todos = todos.filter(t => t._id !== tempId);
        } else {
          // Replace temp todo with real one
          const tempIdx = todos.findIndex(t => t._id === tempId);
          if (tempIdx !== -1) {
            todos[tempIdx] = realTodo;
          }
        }
        renderLists();
      } catch (err) {
        console.error('Error adding todo:', err);
        // Rollback
        todos = todos.filter(t => t._id !== tempId);
        renderLists();
        alert('Failed to add todo');
      }
    };

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
